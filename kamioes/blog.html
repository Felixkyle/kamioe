<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog | Kamieo Kreations</title>
<meta name="description" content="Style notes, fabric guides and care tips from Kamieo Kreations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14202E;
  --chalk:#F5F4F1;
  --stripe:#D9D8D3;
  --thread:#B08D57;
  --wine:#6B2A33;
  --white:#FFFFFF;
  --muted:#5B6672;
  --display:'Bodoni Moda',Georgia,serif;
  --body:'Jost','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--chalk);line-height:1.65;font-size:17px;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--thread);outline-offset:3px}
.wrap{width:min(1180px,92%);margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(2.6rem,6vw,4.8rem)}
h2{font-size:clamp(1.9rem,3.6vw,2.8rem);margin-bottom:.6rem}
h3{font-size:1.35rem;margin-bottom:.4rem}
p{max-width:62ch}
.lead{font-size:1.15rem;color:var(--muted)}
section{padding:clamp(3.5rem,8vw,6.5rem) 0}

/* header */
.site-header{position:sticky;top:0;z-index:50;background:var(--ink);color:var(--chalk)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;height:78px}
.logo{display:flex;align-items:center;gap:.7rem}
.logo img{height:52px;width:auto;background:#fff;padding:3px;border-radius:2px}
.logo-text{display:flex;flex-direction:column;line-height:1}
.logo-text strong{font-family:var(--display);font-size:1.6rem;letter-spacing:.14em;font-weight:500}
.logo-text span{font-size:.62rem;letter-spacing:.5em;color:var(--thread);margin-top:.3rem;padding-left:.15rem}
.nav{display:flex;align-items:center;gap:2rem}
.nav a{font-size:.88rem;letter-spacing:.14em;text-transform:uppercase;padding:.3rem 0;border-bottom:1px solid transparent;transition:border-color .2s}
.nav a:hover,.nav a.active{border-color:var(--thread)}
.nav a.btn-nav{border:1px solid var(--thread);padding:.55rem 1.1rem;color:var(--thread)}
.nav a.btn-nav:hover,.nav a.btn-nav.active{background:var(--thread);color:var(--ink)}
.cart-btn{background:none;border:0;color:inherit;cursor:pointer;font:inherit;font-size:.88rem;letter-spacing:.1em;display:flex;align-items:center;gap:.4rem}
.cart-count{background:var(--thread);color:var(--ink);border-radius:20px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:.75rem;font-weight:600}
.menu-toggle{display:none;background:none;border:0;color:inherit;font-size:1.7rem;cursor:pointer}
@media(max-width:960px){
  .menu-toggle{display:block}
  .nav{position:absolute;top:78px;left:0;right:0;background:var(--ink);flex-direction:column;align-items:flex-start;padding:1.2rem 4%;gap:1.1rem;display:none;border-top:1px solid #2a3a4d}
  .nav.open{display:flex}
}

/* buttons */
.btn{display:inline-block;padding:.95rem 1.9rem;border:1px solid var(--ink);background:var(--ink);color:var(--chalk);font-family:var(--body);font-size:.88rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--thread);border-color:var(--thread);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--chalk);border-color:var(--ink)}
.btn.light{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.btn.light:hover{background:var(--thread);border-color:var(--thread)}
.btn.small{padding:.6rem 1.1rem;font-size:.78rem}

/* hero: pinstripe is the one memorable element */
.hero{background:var(--ink);color:var(--chalk);position:relative;overflow:hidden;padding:0}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(245,244,241,.07) 46px 47px)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:3rem;align-items:center;min-height:82vh;padding:4rem 0}
.hero h1{margin-bottom:1.2rem}
.hero p{color:#c9cfd6;margin-bottom:2rem;font-size:1.15rem}
.hero .actions{display:flex;gap:1rem;flex-wrap:wrap}
.hero-img{aspect-ratio:4/5;background:#22324a center/cover no-repeat;border:1px solid rgba(176,141,87,.5);outline:1px solid rgba(176,141,87,.25);outline-offset:12px}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr;min-height:auto}.hero-img{aspect-ratio:4/3;order:-1;outline:0}}

/* page banner */
.banner{background:var(--ink);color:var(--chalk);padding:4.5rem 0 3.5rem;position:relative}
.banner::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(245,244,241,.06) 46px 47px)}
.banner .wrap{position:relative}
.banner p{color:#c9cfd6;margin-top:.8rem}

/* two paths */
.paths{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.path{position:relative;min-height:440px;background:#22324a center/cover no-repeat;color:var(--chalk);display:flex;align-items:flex-end;padding:2rem}
.path::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,32,46,.88),rgba(20,32,46,.1) 60%)}
.path>div{position:relative;z-index:1}
.path p{color:#dfe3e8;margin-bottom:1rem}
@media(max-width:760px){.paths{grid-template-columns:1fr}.path{min-height:340px}}

/* split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
.split .img{aspect-ratio:4/5;background:#cfcfca center/cover no-repeat}
.split.reverse .img{order:2}
@media(max-width:860px){.split{grid-template-columns:1fr;gap:2rem}.split.reverse .img{order:0}}
.split p+p{margin-top:1rem}

/* process: a true sequence, so numbered */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--stripe)}
.step{padding:1.8rem 1.5rem 1.8rem 0;border-right:1px solid var(--stripe);padding-left:1.5rem}
.step:first-child{padding-left:0}
.step:last-child{border-right:0}
.step b{font-family:var(--display);font-size:2rem;color:var(--thread);display:block;margin-bottom:.4rem;font-weight:500}
@media(max-width:860px){.steps{grid-template-columns:1fr 1fr}.step{border-bottom:1px solid var(--stripe);padding-left:0}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}

.dark{background:var(--ink);color:var(--chalk)}
.dark .lead,.dark p{color:#c9cfd6}
.cta-band{text-align:center}
.cta-band p{margin:0 auto 1.8rem}

/* services list */
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;margin-top:2.5rem}
.service{background:var(--white);padding:2rem;border-top:3px solid var(--thread)}
.service p{color:var(--muted);font-size:.98rem}
@media(max-width:860px){.services{grid-template-columns:1fr}}

/* shop */
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:2rem}
.chip{padding:.5rem 1.1rem;border:1px solid var(--stripe);background:var(--white);font:inherit;font-size:.85rem;letter-spacing:.08em;cursor:pointer}
.chip.on{background:var(--ink);color:var(--chalk);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.8rem}
.card{background:var(--white);display:flex;flex-direction:column}
.card .pic{aspect-ratio:3/4;background:var(--stripe) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-family:var(--display);font-size:1.1rem;text-align:center;padding:1rem;position:relative}
.card .tag{position:absolute;top:.8rem;left:.8rem;background:var(--wine);color:#fff;font-size:.72rem;letter-spacing:.1em;padding:.2rem .6rem;text-transform:uppercase}
.card .info{padding:1.1rem 1.2rem 1.3rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.card .price{font-weight:600}
.card .desc{color:var(--muted);font-size:.92rem;line-height:1.5}
.card .row{display:flex;gap:.6rem;margin-top:auto}
.card select{flex:1;padding:.55rem;border:1px solid var(--stripe);background:var(--chalk);font:inherit;font-size:.9rem}
.empty{padding:3rem;text-align:center;color:var(--muted);background:var(--white)}

/* cart drawer */
.overlay{position:fixed;inset:0;background:rgba(20,32,46,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:90}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--chalk);z-index:100;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:1.2rem 1.5rem;border-bottom:1px solid var(--stripe)}
.drawer header button{background:none;border:0;font-size:1.8rem;cursor:pointer}
.drawer .items{flex:1;overflow:auto;padding:1rem 1.5rem}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--stripe);align-items:center}
.line .thumb{width:64px;height:80px;background:var(--stripe) center/cover}
.line small{color:var(--muted)}
.line .qty{display:flex;align-items:center;gap:.5rem;margin-top:.3rem}
.line .qty button{width:26px;height:26px;border:1px solid var(--stripe);background:#fff;cursor:pointer}
.line .rm{background:none;border:0;color:var(--wine);cursor:pointer;font-size:.8rem;text-decoration:underline}
.drawer footer{padding:1.2rem 1.5rem;border-top:1px solid var(--stripe)}
.total{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:600;margin-bottom:1rem}
.drawer footer .btn{width:100%;text-align:center}
.drawer footer small{display:block;margin-top:.7rem;color:var(--muted)}

/* forms */
.form{background:var(--white);padding:2.2rem;display:grid;gap:1.2rem;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:.35rem;font-size:.9rem;letter-spacing:.04em}
.form input,.form select,.form textarea{padding:.8rem;border:1px solid var(--stripe);background:var(--chalk);font:inherit;font-size:1rem}
.form textarea{min-height:120px;resize:vertical}
@media(max-width:640px){.form{grid-template-columns:1fr;padding:1.4rem}}
.book-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:3.5rem}
@media(max-width:860px){.book-grid{grid-template-columns:1fr;gap:2rem}}
.contact-list{list-style:none;margin-top:1.5rem;display:grid;gap:.9rem}
.contact-list b{display:block;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--thread)}
.note{background:var(--white);border-left:3px solid var(--thread);padding:1rem 1.2rem;margin-top:1.5rem;font-size:.95rem;color:var(--muted)}

/* footer */
.site-footer{background:var(--ink);color:#c9cfd6;padding:3.5rem 0 2rem;font-size:.95rem}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:2.5rem}
.site-footer h4{color:var(--chalk);font-family:var(--display);font-weight:500;margin-bottom:.8rem;font-size:1.1rem}
.site-footer li{list-style:none;margin-bottom:.4rem}
.site-footer a:hover{color:var(--thread)}
.copy{border-top:1px solid #2a3a4d;margin-top:2.5rem;padding-top:1.2rem;font-size:.85rem}
@media(max-width:760px){.foot{grid-template-columns:1fr}}

/* admin */
.admin-box{background:var(--white);padding:2rem;margin-bottom:2rem}
.admin-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:2rem;align-items:start}
@media(max-width:900px){.admin-grid{grid-template-columns:1fr}}
.form.one{grid-template-columns:1fr}
.plist{display:grid;gap:.8rem}
.prow{display:grid;grid-template-columns:56px 1fr auto;gap:1rem;align-items:center;background:var(--chalk);padding:.7rem}
.prow .thumb{width:56px;height:70px;background:var(--stripe) center/cover}
.prow small{color:var(--muted)}
.prow .acts{display:flex;gap:.4rem;flex-wrap:wrap}
.msg{padding:.8rem 1rem;margin-bottom:1rem;font-size:.95rem}
.msg.ok{background:#e4efe4;color:#24522a}
.msg.err{background:#f3dcdc;color:#7a1f1f}
.demo-flag{background:#fff3d6;border-left:3px solid var(--thread);padding:.9rem 1.1rem;margin-bottom:1.5rem;font-size:.92rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ===== image slots: every photo is an <img>; if it fails to load the label shows instead ===== */
.slot{position:relative;overflow:hidden;display:block;background:#cfd0cb}
.slot::before{content:attr(data-name);position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:1rem;font-family:var(--display);color:var(--muted)}
.slot img{position:relative;width:100%;height:100%;object-fit:cover;display:block}
.hero .slot{aspect-ratio:4/5;border:1px solid rgba(176,141,87,.5);outline:1px solid rgba(176,141,87,.25);outline-offset:12px;background:#22324a}
.hero .slot::before,.banner .slot::before{color:#9fb0c4}
@media(max-width:860px){.hero .slot{aspect-ratio:4/3;order:-1;outline:0}}
.banner{padding:3.5rem 0}
.banner .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:3rem;align-items:center}
.banner .slot{aspect-ratio:4/5;background:#22324a}
.banner .slot img{object-position:center top}
@media(max-width:860px){.banner .wrap{grid-template-columns:1fr;gap:1.8rem}}
.split .slot{aspect-ratio:4/5}
.split.reverse .slot{order:2}
@media(max-width:860px){.split.reverse .slot{order:0}}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:2rem}
.gallery .slot{aspect-ratio:3/4}
.cap{font-size:.92rem;margin-top:.5rem;color:var(--muted)}
@media(max-width:860px){.gallery{grid-template-columns:1fr 1fr}}
.vcard .slot{aspect-ratio:4/3}
.vcard h3{margin-top:1rem}
.vcard p{color:#c9cfd6;font-size:.98rem}
.services.three{grid-template-columns:repeat(3,1fr)}
.services.four{grid-template-columns:repeat(4,1fr)}
.service.has-img{padding:0}
.service.has-img .slot{aspect-ratio:4/5}
.service.has-img .body{padding:1.4rem}
.meta{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;font-size:.88rem;color:var(--muted);margin-top:.8rem}
.meta strong{color:var(--ink)}
@media(max-width:1000px){.services.four{grid-template-columns:1fr 1fr}.services.three{grid-template-columns:1fr}}
@media(max-width:560px){.services.four{grid-template-columns:1fr}}
.steps.three{grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.steps.three{grid-template-columns:1fr}.steps.three .step{border-right:0;padding-left:0}}
section.contact{background:var(--white)}
.contact-list a{border-bottom:1px solid var(--thread)}
.btn-row{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1.8rem}

/* ===== blog ===== */
.pcard{background:var(--white);display:flex;flex-direction:column;color:inherit}
.pcard .slot{aspect-ratio:4/3}
.pcard .info{padding:1.2rem 1.3rem 1.5rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.pcard .kicker,.article .kicker{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--thread);font-weight:500}
.pcard h3{margin:0}
.pcard p{color:var(--muted);font-size:.95rem;line-height:1.55}
.pcard .more{margin-top:auto;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--thread);align-self:flex-start;padding-bottom:2px}
.pcard:hover h3{color:var(--wine)}
.article{max-width:760px;margin:0 auto}
.article h1{font-size:clamp(2.1rem,4.5vw,3.2rem);margin:.6rem 0 .8rem}
.article .by{color:var(--muted);font-size:.95rem;margin-bottom:1.6rem}
.article .slot{aspect-ratio:16/9;margin-bottom:2rem}
.article p{margin-bottom:1.3rem;font-size:1.1rem;max-width:none}
.back{display:inline-block;margin-bottom:1.5rem;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--thread)}
textarea.tall{min-height:260px}

</style>
</head>

    async remove(id, token) {
      if (online) {
        const r = await fetch(S.supabaseUrl + "/rest/v1/products?id=eq." + encodeURIComponent(id), { method: "DELETE", headers: hdr(token) });
        if (!r.ok) throw new Error("Delete failed (" + r.status + ")");
        return;
      }
      const all = (await this.list()).filter((x) => x.id !== id);
      localStorage.setItem(LS, JSON.stringify(all));
    },
    async listPosts(all, token) {
      if (online) {
        const r = await fetch(S.supabaseUrl + "/rest/v1/posts?select=*&order=created_at.desc" + (all ? "" : "&published=eq.true"), { headers: hdr(all ? token : undefined) });
        if (!r.ok) throw new Error("Could not load posts");
        return r.json();
      }
      let d = localStorage.getItem(PK);
      if (!d) { localStorage.setItem(PK, JSON.stringify(POSTS_SAMPLE)); d = JSON.stringify(POSTS_SAMPLE); }
      const list = JSON.parse(d);
      return all ? list : list.filter((p) => p.published !== false);
    },
    async savePost(p, token) {
      if (online) {
        const body = { title: p.title, category: p.category, author: p.author, excerpt: p.excerpt, content: p.content, image_url: p.image_url, published: p.published };
        const url = S.supabaseUrl + "/rest/v1/posts" + (p.id ? "?id=eq." + encodeURIComponent(p.id) : "");
        const r = await fetch(url, { method: p.id ? "PATCH" : "POST", headers: { ...hdr(token), Prefer: "return=minimal" }, body: JSON.stringify(body) });
        if (!r.ok) throw new Error("Save failed (" + r.status + "). Are you signed in?");
        return;
      }
      const all = await this.listPosts(true);
      if (p.id) { const i = all.findIndex((x) => x.id === p.id); if (i > -1) all[i] = { ...all[i], ...p }; }
      else { p.id = "p" + Date.now(); p.created_at = new Date().toISOString(); all.unshift(p); }
      localStorage.setItem(PK, JSON.stringify(all));
    },
    async removePost(id, token) {
      if (online) {
        const r = await fetch(S.supabaseUrl + "/rest/v1/posts?id=eq." + encodeURIComponent(id), { method: "DELETE", headers: hdr(token) });
        if (!r.ok) throw new Error("Delete failed (" + r.status + ")");
        return;
      }
      const all = (await this.listPosts(true)).filter((x) => x.id !== id);
      localStorage.setItem(PK, JSON.stringify(all));
    },
    async login(email, password) {
      const r = await fetch(S.supabaseUrl + "/auth/v1/token?grant_type=password", { method: "POST", headers: { apikey: S.supabaseKey, "Content-Type": "application/json" }, body: JSON.stringify({ email, password }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error_description || d.msg || "Wrong email or password");
      return d.access_token;
    },
    async upload(file, token) {
      const name = Date.now() + "-" + file.name.replace(/[^a-z0-9.\-_]/gi, "_");
      if (online) {
        const r = await fetch(S.supabaseUrl + "/storage/v1/object/products/" + name, { method: "POST", headers: { apikey: S.supabaseKey, Authorization: "Bearer " + token, "Content-Type": file.type }, body: file });
        if (!r.ok) throw new Error("Image upload failed (" + r.status + ")");
        return S.supabaseUrl + "/storage/v1/object/public/products/" + name;
      }
      // demo mode: shrink the image and keep it in the browser
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => {
          const max = 700, k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = img.width * k; c.height = img.height * k;
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL("image/jpeg", 0.8));
        };
        img.onerror = () => rej(new Error("Could not read that image"));
        img.src = URL.createObjectURL(file);
      });
    }
  };
  window.IK = { API, esc, money, wa, S };

  /* ---------- cart ---------- */
  const CK = "ik_cart";
  const getCart = () => JSON.parse(localStorage.getItem(CK) || "[]");
  const setCart = (c) => { localStorage.setItem(CK, JSON.stringify(c)); drawCart(); };
  function addToCart(p, size) {
    const c = getCart();
    const key = p.id + "|" + size;
    const f = c.find((x) => x.key === key);
    if (f) f.qty++;
    else c.push({ key, name: p.name, price: Number(p.price), image: p.image_url || "", size, qty: 1 });
    setCart(c);
    openCart();
  }
  function buildCart() {
    const root = document.createElement("div");
    root.innerHTML = `<div class="overlay" id="overlay"></div>
      <aside class="drawer" id="drawer" aria-label="Cart">
        <header><h3>Your cart</h3><button id="close-cart" aria-label="Close cart">&times;</button></header>
        <div class="items" id="cart-items"></div>
        <footer><div class="total"><span>Total</span><span id="cart-total"></span></div>
        <button class="btn" id="checkout">Order on WhatsApp</button>
        <small>We confirm stock and delivery with you on WhatsApp.</small></footer>
      </aside>`;
    document.body.appendChild(root);
    $("#open-cart").addEventListener("click", openCart);
    $("#close-cart").addEventListener("click", closeCart);
    $("#overlay").addEventListener("click", closeCart);
    $("#checkout").addEventListener("click", () => {
      const c = getCart(); if (!c.length) return;
      const lines = c.map((i) => `- ${i.qty} x ${i.name} (size ${i.size}) = ${money(i.price * i.qty)}`);
      const total = c.reduce((a, i) => a + i.price * i.qty, 0);
      window.open(wa("Hello, I'd like to order:\n" + lines.join("\n") + "\nTotal: " + money(total)), "_blank");
    });
    $("#cart-items").addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]"); if (!b) return;
      const c = getCart(); const i = c.findIndex((x) => x.key === b.dataset.key); if (i < 0) return;
      if (b.dataset.act === "inc") c[i].qty++;
      if (b.dataset.act === "dec") c[i].qty = Math.max(1, c[i].qty - 1);
      if (b.dataset.act === "rm") c.splice(i, 1);
      setCart(c);
    });
    drawCart();
  }
  function drawCart() {
    const c = getCart();
    const n = c.reduce((a, i) => a + i.qty, 0);
    const cc = $("#cart-count"); if (cc) cc.textContent = n;
    const box = $("#cart-items"); if (!box) return;
    box.innerHTML = c.length ? c.map((i) => `<div class="line">
      <div class="thumb" style="background-image:url('${esc(i.image)}')"></div>
      <div><strong>${esc(i.name)}</strong><br><small>Size ${esc(i.size)} &middot; ${money(i.price)}</small>
        <div class="qty"><button data-act="dec" data-key="${esc(i.key)}" aria-label="Less">&minus;</button><span>${i.qty}</span><button data-act="inc" data-key="${esc(i.key)}" aria-label="More">+</button></div></div>
      <button class="rm" data-act="rm" data-key="${esc(i.key)}">Remove</button></div>`).join("") : '<p class="empty">Your cart is empty. Pick something from Ready to wear.</p>';
    $("#cart-total").textContent = money(c.reduce((a, i) => a + i.price * i.qty, 0));
  }
  function openCart() { $("#drawer").classList.add("open"); $("#overlay").classList.add("open"); }
  function closeCart() { $("#drawer").classList.remove("open"); $("#overlay").classList.remove("open"); }

  /* ---------- shop rendering ---------- */
  function card(p) {
    const sizes = String(p.sizes || "One size").split(",").map((s) => s.trim()).filter(Boolean);
    const out = p.in_stock === false;
    const pic = p.image_url ? `style="background-image:url('${esc(p.image_url)}')"` : "";
    return `<article class="card" data-id="${esc(p.id)}">
      <div class="pic" ${pic}>${p.image_url ? "" : esc(p.name)}${out ? '<span class="tag">Sold out</span>' : ""}</div>
      <div class="info"><h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div>
        <p class="desc">${esc(p.description)}</p>
        <div class="row">${out ? '<button class="btn small" disabled style="opacity:.5;cursor:not-allowed;width:100%">Sold out</button>'
          : `<select aria-label="Size">${sizes.map((s) => `<option>${esc(s)}</option>`).join("")}</select><button class="btn small" data-add>Add to cart</button>`}</div>
      </div></article>`;
  }
  window.renderShop = async function (box, opts = {}) {
    let list;
    try { list = await API.list(); } catch (e) { box.innerHTML = '<p class="empty">Products could not load. Please refresh.</p>'; return; }
    if (opts.limit) list = list.slice(0, opts.limit);
    let current = "All";
    const bar = opts.filters ? $(opts.filters) : null;
    const draw = () => {
      const shown = current === "All" ? list : list.filter((p) => p.category === current);
      box.innerHTML = shown.length ? shown.map(card).join("") : '<p class="empty">Nothing here yet. Check back soon.</p>';
    };
    if (bar) {
      const cats = ["All", ...new Set(list.map((p) => p.category).filter(Boolean))];
      bar.innerHTML = cats.map((c, i) => `<button class="chip ${i === 0 ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
      bar.addEventListener("click", (e) => {
        const b = e.target.closest("[data-cat]"); if (!b) return;
        current = b.dataset.cat;
        bar.querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x === b));
        draw();
      });
    }
    box.addEventListener("click", (e) => {
      const b = e.target.closest("[data-add]"); if (!b) return;
      const el = b.closest(".card");
      const p = list.find((x) => String(x.id) === el.dataset.id);
      addToCart(p, $("select", el).value);
    });
    draw();
  };

  /* ---------- booking form ---------- */
  function bookingForm() {
    const f = $("#book-form"); if (!f) return;
    f.addEventListener("submit", (e) => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(f));
      const msg = `Hello, I'd like to book an appointment.\nName: ${d.name}\nPhone: ${d.phone}\nService: ${d.service}\nPreferred date: ${d.date || "Flexible"}\nDetails: ${d.details || "-"}`;
      window.open(wa(msg), "_blank");
      $("#book-ok").hidden = false;
    });
  }


  function fillContact() {
    const msg = "Hello, I have an enquiry.";
    document.querySelectorAll("[data-contact]").forEach((ul) => {
      ul.innerHTML = `<li><b>Address</b>${esc(S.address)}</li>
        <li><b>WhatsApp</b><a href="${wa(msg)}">+${esc(S.whatsapp)}</a></li>
        <li><b>Email</b><a href="mailto:${esc(S.email)}">${esc(S.email)}</a></li>
        <li><b>Instagram</b><a href="${esc(S.instagram)}" target="_blank" rel="noopener">@kamieokreations</a></li>`;
    });
    document.querySelectorAll("[data-wa]").forEach((a) => { a.href = wa(msg); a.target = "_blank"; a.rel = "noopener"; });
  }

  document.addEventListener("DOMContentLoaded", () => { buildChrome(); buildCart(); bookingForm(); fillContact(); });
})();

</script>
<script>
(async function () {
  const { API, esc } = IK;
  const root = document.getElementById("blog-root");
  const fmt = (d) => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  const cover = (p) => '<figure class="slot" data-name="' + esc(p.title) + '">' + (p.image_url ? '<img src="' + esc(p.image_url) + '" alt="" onerror="this.remove()">' : "") + "</figure>";
  let posts;
  try { posts = await API.listPosts(false); } catch (e) { root.innerHTML = '<p class="empty">Posts could not load. Please refresh.</p>'; return; }
  root.innerHTML = posts.length ? '<div class="grid">' + posts.map((p) => '<a class="pcard" href="post.html?id=' + encodeURIComponent(p.id) + '">' + cover(p) + '<div class="info"><div class="kicker">' + esc(p.category || "Update") + " &middot; " + fmt(p.created_at) + "</div><h3>" + esc(p.title) + "</h3><p>" + esc(p.excerpt || "") + '</p><span class="more">Read more</span></div></a>').join("") + "</div>" : '<p class="empty">No posts yet. Check back soon.</p>';
})();
</script>
